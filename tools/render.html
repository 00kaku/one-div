<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>One Div: render one piece</title>
	<!-- Draws one piece, centred on its tile colour, at 2×: render.html#06-mountain.
	     tools/readme.py screenshots this page to make the README thumbnails. -->
	<style>
		html, body { height: 100%; margin: 0; }
		body { display: grid; place-items: center; overflow: hidden; }
		#art { zoom: 2; }
	</style>
</head>
<body>
	<div id="art"></div>
	<script>
		( async () => {
			const pad = ( n ) => String( n ).padStart( 2, '0' );
			const list = await ( await fetch( '../pieces.json' ) ).json();
			const piece = list.find( ( p ) => location.hash === `#${ pad( p.n ) }-${ p.slug }` );
			if ( ! piece ) {
				return;
			}
			document.body.style.background = piece.bg || '#f4efe4';
			const html = await ( await fetch( '../' + piece.file ) ).text();
			const root = document.getElementById( 'art' ).attachShadow( { mode: 'open' } );
			root.innerHTML = '<style>.single-div-stage { display: grid; place-items: center; width: 200px; height: 200px; }</style>' +
				html.replace( /<!--[\s\S]*?-->/, '' ).trim();
			document.body.dataset.ready = '';
		} )();
	</script>
</body>
</html>
